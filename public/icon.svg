<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d9488;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f766e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2dd4bf;stop-opacity:0.85" />
      <stop offset="100%" style="stop-color:#14b8a6;stop-opacity:0.85" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" style="stop-color:#0d9488;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#0d9488;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="240" fill="none" stroke="#0d9488" stroke-width="4" opacity="0.3" />
  <circle cx="256" cy="200" r="180" fill="url(#glow)" />
  
  <!-- Antennae -->
  <g stroke="#5eead4" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M230 140 Q210 80 170 50 Q145 28 140 30" />
    <path d="M282 140 Q302 80 342 50 Q367 28 372 30" />
    <circle cx="140" cy="30" r="8" fill="#2dd4bf" stroke="none" />
    <circle cx="372" cy="30" r="8" fill="#2dd4bf" stroke="none" />
  </g>
  
  <!-- Left wing (elytron) -->
  <ellipse cx="200" cy="260" rx="85" ry="110" fill="url(#wingGrad)" stroke="#0d9488" stroke-width="3" 
           transform="rotate(-10, 200, 260)" />
  <line x1="200" y1="150" x2="200" y2="370" stroke="#0d9488" stroke-width="2" opacity="0.4" />
  <line x1="140" y1="230" x2="255" y2="230" stroke="#0d9488" stroke-width="1.5" opacity="0.25" />
  <line x1="140" y1="280" x2="255" y2="280" stroke="#0d9488" stroke-width="1.5" opacity="0.25" />
  
  <!-- Right wing (elytron) -->
  <ellipse cx="312" cy="260" rx="85" ry="110" fill="url(#wingGrad)" stroke="#0d9488" stroke-width="3" 
           transform="rotate(10, 312, 260)" />
  <line x1="312" y1="150" x2="312" y2="370" stroke="#0d9488" stroke-width="2" opacity="0.4" />
  <line x1="257" y1="230" x2="372" y2="230" stroke="#0d9488" stroke-width="1.5" opacity="0.25" />
  <line x1="257" y1="280" x2="372" y2="280" stroke="#0d9488" stroke-width="1.5" opacity="0.25" />
  
  <!-- Body (abdomen) -->
  <ellipse cx="256" cy="310" rx="42" ry="75" fill="url(#bodyGrad)" stroke="#14b8a6" stroke-width="2" />
  <!-- Body segmentation lines -->
  <line x1="224" y1="270" x2="288" y2="270" stroke="#0d9488" stroke-width="1.5" opacity="0.5" />
  <line x1="222" y1="295" x2="290" y2="295" stroke="#0d9488" stroke-width="1.5" opacity="0.5" />
  <line x1="225" y1="320" x2="287" y2="320" stroke="#0d9488" stroke-width="1.5" opacity="0.5" />
  <line x1="229" y1="345" x2="283" y2="345" stroke="#0d9488" stroke-width="1.5" opacity="0.5" />
  
  <!-- Thorax -->
  <circle cx="256" cy="220" r="38" fill="url(#bodyGrad)" stroke="#14b8a6" stroke-width="2" />
  
  <!-- Head -->
  <circle cx="256" cy="174" r="28" fill="url(#bodyGrad)" stroke="#14b8a6" stroke-width="2" />
  
  <!-- Eyes -->
  <circle cx="242" cy="168" r="9" fill="#ccfbf1" />
  <circle cx="270" cy="168" r="9" fill="#ccfbf1" />
  <circle cx="244" cy="167" r="4" fill="#0f172a" />
  <circle cx="268" cy="167" r="4" fill="#0f172a" />
  
  <!-- Legs - left side -->
  <g stroke="#5eead4" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M210 220 Q180 210 155 240 Q140 260 145 275" />
    <path d="M210 235 Q175 240 160 270 Q150 295 155 310" />
    <path d="M215 250 Q180 265 165 300 Q155 325 160 340" />
  </g>
  
  <!-- Legs - right side -->
  <g stroke="#5eead4" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M302 220 Q332 210 357 240 Q372 260 367 275" />
    <path d="M302 235 Q337 240 352 270 Q362 295 357 310" />
    <path d="M297 250 Q332 265 347 300 Q357 325 352 340" />
  </g>
</svg>
